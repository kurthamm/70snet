<!doctype html>
<html lang="en">
  <!--
    data-exchange-url: an override for the switchboard's WebSocket address.
    In deployment, the switchboard (apps/switchboard) serves this very page
    -- one host, one Cloudflare tunnel, same origin for the room and the
    exchange -- so by default room.ts derives the address itself: same
    host, same port, ws:/wss: matching the page's own protocol (see
    webSocketExchangeConnector in src/room.ts). That is the correct default,
    not a fallback hiding a missing value. Set this attribute only for local
    development, e.g. running `vite` for the page while a switchboard
    listens on a different port (ws://localhost:8080).
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>70snet &mdash; the 1980 room</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
